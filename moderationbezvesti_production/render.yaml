services:
  - type: web
    name: moderationbezvesti
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moderationbezvesti-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: BOOTSTRAP_ADMIN
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
      - key: RATELIMIT_STORAGE_URI
        sync: false
databases:
  - name: moderationbezvesti-db
    plan: basic-256mb
