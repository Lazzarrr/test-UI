{% extends "base.html" %}{% block content %}<div class="eyebrow">ОТЧЁТНОСТЬ</div><h1>Наказания</h1><section class="panel"><h2>Новый отчёт</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Кому выдано наказание</label><input name="target" required><label>Тип наказания</label><select name="punishment"><option>Предупреждение</option><option>Выговор</option><option>Мут</option><option>Бан</option><option>Другое</option></select><label>Дата</label><input type="date" name="report_date" required><label>Причина и подробности</label><textarea name="reason" rows="3" required></textarea><button>Отправить отчёт</button></form></section><section class="panel"><h2>Отправленные отчёты</h2>{% for r in rows %}<article class="report"><b>{{r.target}} · {{r.punishment}}</b><p>{{r.reason}}</p><small>{{r.report_date}} · {{r.author.display_name}}</small></article>{% else %}<p class="muted">Отчётов пока нет.</p>{% endfor %}</section>{% endblock %}
